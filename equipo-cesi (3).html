<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Equipo CESI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14161C;
    --surface:#1C1F27;
    --surface-hover:#20242E;
    --line:#2B2F3A;
    --ink:#EDEFF3;
    --ink-soft:#9AA0AC;

    --dep-direccion:#6C8EEF;      --dep-direccion-soft:rgba(108,142,239,.14);
    --dep-profesores:#4FB286;     --dep-profesores-soft:rgba(79,178,134,.14);
    --dep-moderacion:#E2574C;     --dep-moderacion-soft:rgba(226,87,76,.14);
    --dep-media:#B876E0;          --dep-media-soft:rgba(184,118,224,.14);
    --dep-reclutamiento:#F2B84B;  --dep-reclutamiento-soft:rgba(242,184,75,.14);
    --dep-radio:#43B8D6;          --dep-radio-soft:rgba(67,184,214,.14);
    --dep-tienda:#E2984B;         --dep-tienda-soft:rgba(226,152,75,.14);
    --dep-finanzas:#7FC77A;       --dep-finanzas-soft:rgba(127,199,122,.14);
    --dep-alianza:#D66FA6;        --dep-alianza-soft:rgba(214,111,166,.14);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    background-image:
      radial-gradient(circle at 15% 0%, rgba(108,142,239,.08), transparent 45%),
      radial-gradient(circle at 85% 10%, rgba(214,111,166,.06), transparent 40%);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .equipo-container{
    max-width:1200px;
    margin:0 auto;
    padding:56px 28px 90px;
  }

  /* ---- Title (kept from provided rule, adapted for dark background) ---- */
  .titulo-equipo{
    font-family:'Space Grotesk',sans-serif;
    font-size:32px;
    font-weight:700;
    margin-bottom:25px;
    text-align:center;
    color:var(--ink);
    letter-spacing:-0.01em;
  }
  .subtitulo-equipo{
    text-align:center;
    color:var(--ink-soft);
    font-size:14.5px;
    max-width:520px;
    margin:0 auto 40px;
    line-height:1.6;
  }

  /* ---- Department nav ---- */
  .departamentos-nav{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
    margin-bottom:44px;
    position:sticky;
    top:0;
    padding:14px 0;
    background:linear-gradient(var(--bg) 70%, transparent);
    z-index:20;
  }
  .departamentos-nav button{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    letter-spacing:.03em;
    color:var(--ink-soft);
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:100px;
    padding:9px 16px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:8px;
    transition:border-color .18s ease, color .18s ease, background .18s ease, transform .12s ease;
  }
  .departamentos-nav button::before{
    content:"";
    width:7px; height:7px; border-radius:50%;
    background:var(--dot,var(--ink-soft));
    flex:none;
  }
  .departamentos-nav button:hover{ transform:translateY(-1px); border-color:var(--dot,var(--ink-soft)); color:var(--ink); }
  .departamentos-nav button.active{
    background:var(--dot,var(--ink-soft));
    border-color:var(--dot,var(--ink-soft));
    color:#10121A;
    font-weight:600;
  }
  .departamentos-nav button.active::before{ background:#10121A; }

  /* ---- Grid & cards ---- */
  .equipo-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
  }
  @media (max-width:900px){ .equipo-grid{ grid-template-columns:repeat(2,1fr);} }
  @media (max-width:560px){ .equipo-grid{ grid-template-columns:1fr; } .equipo-container{ padding:40px 18px 70px;} .departamentos-nav{ justify-content:flex-start; overflow-x:auto; flex-wrap:nowrap; padding-bottom:10px; } }

  .tarjeta{
    background:var(--surface);
    border:1px solid var(--line);
    border-top:3px solid var(--dot,var(--dep-direccion));
    border-radius:14px;
    padding:20px 20px 22px;
    cursor:pointer;
    text-align:left;
    display:flex;
    flex-direction:column;
    gap:10px;
    transition:transform .18s ease, background .18s ease, box-shadow .18s ease;
  }
  .tarjeta:hover, .tarjeta:focus-visible{
    background:var(--surface-hover);
    transform:translateY(-3px);
    box-shadow:0 16px 30px -20px rgba(0,0,0,.6);
    outline:none;
  }

  .avatar-wrap{
    width:64px; height:64px;
    border-radius:50%;
    position:relative;
    overflow:hidden;
    background:linear-gradient(155deg,var(--dot,var(--dep-direccion)), #10121A 130%);
    display:flex; align-items:center; justify-content:center;
    margin-bottom:4px;
  }
  .avatar-wrap span{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:20px;
    color:#fff;
  }
  .avatar-wrap img{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
  }

  .tarjeta h3{
    font-family:'Space Grotesk',sans-serif;
    font-size:17px;
    font-weight:600;
    margin:0;
    color:var(--ink);
  }
  .tarjeta p{
    font-size:13px;
    line-height:1.55;
    color:var(--ink-soft);
    margin:0;
  }
  .tarjeta p strong{ color:var(--ink); font-weight:500; }

  .tarjeta .trayectoria{
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }

  .dep-chip{
    align-self:flex-start;
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    padding:4px 10px;
    border-radius:100px;
    background:var(--dot-soft,var(--dep-direccion-soft));
    color:var(--dot,var(--dep-direccion));
  }

  .ver-mas{
    font-size:12px;
    color:var(--ink-soft);
    display:flex; align-items:center; gap:6px;
    margin-top:2px;
  }
  .ver-mas svg{ width:11px; height:11px; transition:transform .18s ease; }
  .tarjeta:hover .ver-mas svg{ transform:translateX(3px); }

  .oculta{ display:none !important; }

  /* ---- Vacantes ---- */
  .vacantes-bloque{
    text-align:center;
    margin-top:56px;
    padding-top:40px;
    border-top:1px solid var(--line);
  }
  .btn-vacantes{
    display:inline-block;
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:14.5px;
    color:#10121A;
    background:#EDEFF3;
    padding:13px 28px;
    border-radius:100px;
    text-decoration:none;
    transition:transform .15s ease, background .15s ease;
  }
  .btn-vacantes:hover{ transform:translateY(-2px); background:#fff; }

  /* ---- Modal ---- */
  .overlay{
    position:fixed; inset:0;
    background:rgba(10,11,15,0.7);
    display:flex; align-items:center; justify-content:center;
    padding:24px;
    z-index:100;
    opacity:0; pointer-events:none;
    transition:opacity .2s ease;
  }
  .overlay.open{ opacity:1; pointer-events:auto; }

  .modal{
    background:var(--surface);
    border:1px solid var(--line);
    max-width:520px; width:100%;
    max-height:88vh; overflow-y:auto;
    border-radius:16px;
    transform:translateY(14px) scale(.98);
    transition:transform .2s ease;
    position:relative;
  }
  .overlay.open .modal{ transform:translateY(0) scale(1); }

  .modal-top{
    border-top:4px solid var(--dot,var(--dep-direccion));
    padding:30px 28px 22px;
    display:flex; align-items:center; gap:16px;
    position:relative;
  }
  .modal-avatar{
    width:64px; height:64px; border-radius:50%;
    background:linear-gradient(155deg,var(--dot,var(--dep-direccion)), #10121A 130%);
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:20px; color:#fff;
    flex:none;
    position:relative; overflow:hidden;
  }
  .modal-avatar img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .modal-name{ font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:600; margin:0 0 3px; }
  .modal-role{ font-size:13.5px; color:var(--ink-soft); margin:0; }

  .close-btn{
    position:absolute; top:16px; right:16px;
    width:32px; height:32px; border-radius:50%;
    border:1px solid var(--line);
    background:var(--bg);
    color:var(--ink-soft);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    font-size:14px;
    transition:color .15s ease, border-color .15s ease;
  }
  .close-btn:hover{ color:var(--ink); border-color:var(--dot,var(--ink-soft)); }

  .modal-body{ padding:6px 28px 30px; }
  .modal-chip{
    display:inline-block;
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    padding:4px 10px;
    border-radius:100px;
    background:var(--dot-soft,var(--dep-direccion-soft));
    color:var(--dot,var(--dep-direccion));
    margin-bottom:16px;
  }
  .modal-bio{ font-size:14px; line-height:1.7; color:var(--ink); margin:0 0 20px; }
  .modal-meta{
    display:grid; grid-template-columns:1fr 1fr;
    gap:14px;
    padding-top:16px;
    border-top:1px solid var(--line);
  }
  .modal-meta div p:first-child{
    font-family:'JetBrains Mono',monospace;
    font-size:10px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--ink-soft); margin:0 0 4px;
  }
  .modal-meta div p:last-child{ font-size:13.5px; margin:0; color:var(--ink); }

  @media (max-width:480px){
    .modal-top{ padding:26px 20px 18px; }
    .modal-body{ padding:6px 20px 26px; }
    .modal-meta{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<section class="equipo-container">
    <h2 class="titulo-equipo">Equipo CESI</h2>
    <p class="subtitulo-equipo">Estas son las personas que hacen posible CESI cada día, organizadas por departamento. Filtra o pulsa una tarjeta para ver el perfil completo.</p>

    <!-- Navegador de departamentos -->
    <nav class="departamentos-nav" id="departamentosNav">
        <button data-dep="todos" class="active" style="--dot:#EDEFF3">Todos</button>
        <button data-dep="direccion" style="--dot:var(--dep-direccion)">Dirección</button>
        <button data-dep="profesores" style="--dot:var(--dep-profesores)">Profesores</button>
        <button data-dep="moderacion" style="--dot:var(--dep-moderacion)">Moderación</button>
        <button data-dep="media" style="--dot:var(--dep-media)">Media</button>
        <button data-dep="reclutamiento" style="--dot:var(--dep-reclutamiento)">Reclutamiento</button>
        <button data-dep="radio" style="--dot:var(--dep-radio)">Radio</button>
        <button data-dep="tienda" style="--dot:var(--dep-tienda)">Tienda</button>
        <button data-dep="finanzas" style="--dot:var(--dep-finanzas)">Finanzas</button>
        <button data-dep="alianza" style="--dot:var(--dep-alianza)">Alianza</button>
    </nav>

    <!-- Tarjetas del equipo -->
    <div class="equipo-grid" id="equipoGrid"></div>

    <div class="vacantes-bloque">
        <a href="/vacantes" class="btn-vacantes">Ver Vacantes</a>
    </div>
</section>

<!-- Modal de detalle -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <div class="modal-top" id="modalTop">
      <button class="close-btn" id="closeBtn" aria-label="Cerrar">&#10005;</button>
      <div class="modal-avatar" id="modalAvatar"><span id="modalInitials"></span><img id="modalImg" alt=""></div>
      <div>
        <p class="modal-name" id="modalName"></p>
        <p class="modal-role" id="modalRole"></p>
      </div>
    </div>
    <div class="modal-body">
      <span class="modal-chip" id="modalChip"></span>
      <p class="modal-bio" id="modalBio"></p>
      <div class="modal-meta">
        <div><p>Fecha de ingreso</p><p id="modalFecha"></p></div>
        <div><p>Correo</p><p id="modalCorreo"></p></div>
      </div>
    </div>
  </div>
</div>

<script>
const departamentos = {
  direccion:      { label:'Dirección' },
  profesores:     { label:'Profesores' },
  moderacion:     { label:'Moderación' },
  media:          { label:'Media' },
  reclutamiento:  { label:'Reclutamiento' },
  radio:          { label:'Radio' },
  tienda:         { label:'Tienda' },
  finanzas:       { label:'Finanzas' },
  alianza:        { label:'Alianza' },
};

const equipo = [
  { nombre:'Marc Alsina', rol:'Director General', dep:'direccion', fecha:'12/03/2024', trayectoria:'Responsable de coordinar CESI, supervisar equipos y gestionar proyectos institucionales.', correo:'director@cesi.com', foto:'fotos/marc-alsina.jpg' },
  { nombre:'Helena Duran', rol:'Subdirectora', dep:'direccion', fecha:'03/06/2024', trayectoria:'Supervisa la operativa interna diaria y da soporte directo a cada departamento.', correo:'helena.duran@cesi.com', foto:'fotos/helena-duran.jpg' },

  { nombre:'Ricard Font', rol:'Profesor de Matemáticas', dep:'profesores', fecha:'15/01/2024', trayectoria:'Imparte clases y diseña el temario del área de matemáticas.', correo:'ricard.font@cesi.com', foto:'fotos/ricard-font.jpg' },
  { nombre:'Aina Puig', rol:'Profesora de Idiomas', dep:'profesores', fecha:'22/02/2024', trayectoria:'Coordina el programa de idiomas y el material didáctico asociado.', correo:'aina.puig@cesi.com', foto:'fotos/aina-puig.jpg' },

  { nombre:'Bruno Castells', rol:'Jefe de Moderación', dep:'moderacion', fecha:'05/04/2024', trayectoria:'Vela por el cumplimiento de las normas de la comunidad y forma al resto del equipo.', correo:'bruno.castells@cesi.com', foto:'fotos/bruno-castells.jpg' },
  { nombre:'Nadia Torres', rol:'Moderadora', dep:'moderacion', fecha:'18/05/2024', trayectoria:'Gestiona incidencias diarias y da soporte directo a los usuarios.', correo:'nadia.torres@cesi.com', foto:'fotos/nadia-torres.jpg' },

  { nombre:'Diego Ramos', rol:'Editor de Vídeo', dep:'media', fecha:'01/02/2024', trayectoria:'Produce y edita el contenido audiovisual de CESI.', correo:'diego.ramos@cesi.com', foto:'fotos/diego-ramos.jpg' },
  { nombre:'Carla Núñez', rol:'Diseñadora Gráfica', dep:'media', fecha:'10/03/2024', trayectoria:'Crea las piezas visuales de la marca para redes y campañas.', correo:'carla.nunez@cesi.com', foto:'fotos/carla-nunez.jpg' },

  { nombre:'Iván Costa', rol:'Responsable de Reclutamiento', dep:'reclutamiento', fecha:'20/01/2024', trayectoria:'Organiza los procesos de selección de nuevos miembros del equipo.', correo:'ivan.costa@cesi.com', foto:'fotos/ivan-costa.jpg' },
  { nombre:'Paula Reyes', rol:'Técnica de Reclutamiento', dep:'reclutamiento', fecha:'14/06/2024', trayectoria:'Gestiona entrevistas y el proceso de incorporación de cada nuevo miembro.', correo:'paula.reyes@cesi.com', foto:'fotos/paula-reyes.jpg' },

  { nombre:'Sergi Amat', rol:'Director de Radio CESI', dep:'radio', fecha:'08/02/2024', trayectoria:'Dirige la programación y la parrilla de la radio.', correo:'sergi.amat@cesi.com', foto:'fotos/sergi-amat.jpg' },
  { nombre:'Lucía Ferrer', rol:'Locutora', dep:'radio', fecha:'25/03/2024', trayectoria:'Presenta programas semanales en directo.', correo:'lucia.ferrer@cesi.com', foto:'fotos/lucia-ferrer.jpg' },

  { nombre:'Martina Soler', rol:'Responsable de Tienda', dep:'tienda', fecha:'11/01/2024', trayectoria:'Gestiona el catálogo y los pedidos de la tienda oficial.', correo:'martina.soler@cesi.com', foto:'fotos/martina-soler.jpg' },
  { nombre:'Hugo Vidal', rol:'Atención al Cliente', dep:'tienda', fecha:'30/04/2024', trayectoria:'Resuelve consultas e incidencias relacionadas con los pedidos.', correo:'hugo.vidal@cesi.com', foto:'fotos/hugo-vidal.jpg' },

  { nombre:'Andrea Molins', rol:'Responsable de Finanzas', dep:'finanzas', fecha:'07/01/2024', trayectoria:'Supervisa presupuestos e ingresos de CESI.', correo:'andrea.molins@cesi.com', foto:'fotos/andrea-molins.jpg' },
  { nombre:'Pol Serra', rol:'Contable', dep:'finanzas', fecha:'19/05/2024', trayectoria:'Lleva la contabilidad diaria y la gestión de pagos.', correo:'pol.serra@cesi.com', foto:'fotos/pol-serra.jpg' },

  { nombre:'Raúl Ortega', rol:'Responsable de Alianzas', dep:'alianza', fecha:'02/03/2024', trayectoria:'Negocia colaboraciones con otras comunidades y proyectos.', correo:'raul.ortega@cesi.com', foto:'fotos/raul-ortega.jpg' },
  { nombre:'Marina Roig', rol:'Coordinadora de Alianzas', dep:'alianza', fecha:'16/06/2024', trayectoria:'Mantiene la relación diaria con las comunidades aliadas.', correo:'marina.roig@cesi.com', foto:'fotos/marina-roig.jpg' },
];

function iniciales(nombre){
  return nombre.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
}

// ---- Render grid ----
const grid = document.getElementById('equipoGrid');

equipo.forEach((m, i)=>{
  const dep = departamentos[m.dep];
  const tarjeta = document.createElement('div');
  tarjeta.className = 'tarjeta';
  tarjeta.dataset.dep = m.dep;
  tarjeta.tabIndex = 0;
  tarjeta.setAttribute('role','button');
  tarjeta.style.setProperty('--dot', `var(--dep-${m.dep})`);
  tarjeta.style.setProperty('--dot-soft', `var(--dep-${m.dep}-soft)`);
  tarjeta.innerHTML = `
    <div class="avatar-wrap">
      <span>${iniciales(m.nombre)}</span>
      <img src="${m.foto}" alt="Foto de ${m.nombre}" onerror="this.remove()">
    </div>
    <h3>${m.nombre}</h3>
    <p><strong>Rol:</strong> ${m.rol}</p>
    <p class="trayectoria"><strong>Trayectoria:</strong> ${m.trayectoria}</p>
    <span class="dep-chip">${dep.label}</span>
    <span class="ver-mas">Ver perfil completo
      <svg viewBox="0 0 12 12" fill="none"><path d="M2 6H10M10 6L6.5 2.5M10 6L6.5 9.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span>
  `;
  tarjeta.addEventListener('click', ()=>abrirModal(i));
  tarjeta.addEventListener('keydown', (e)=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); abrirModal(i); } });
  grid.appendChild(tarjeta);
});

// ---- Filtro por departamento ----
const nav = document.getElementById('departamentosNav');
nav.addEventListener('click', (e)=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  nav.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const dep = btn.dataset.dep;
  document.querySelectorAll('.tarjeta').forEach(t=>{
    t.classList.toggle('oculta', dep !== 'todos' && t.dataset.dep !== dep);
  });
});

// ---- Modal ----
const overlay = document.getElementById('overlay');
const modalTop = document.getElementById('modalTop');
const modalInitials = document.getElementById('modalInitials');
const modalImg = document.getElementById('modalImg');
const modalName = document.getElementById('modalName');
const modalRole = document.getElementById('modalRole');
const modalChip = document.getElementById('modalChip');
const modalBio = document.getElementById('modalBio');
const modalFecha = document.getElementById('modalFecha');
const modalCorreo = document.getElementById('modalCorreo');
const closeBtn = document.getElementById('closeBtn');

function abrirModal(i){
  const m = equipo[i];
  const dep = departamentos[m.dep];
  modalTop.style.setProperty('--dot', `var(--dep-${m.dep})`);
  modalChip.style.setProperty('--dot', `var(--dep-${m.dep})`);
  modalChip.style.setProperty('--dot-soft', `var(--dep-${m.dep}-soft)`);

  modalInitials.textContent = iniciales(m.nombre);
  modalImg.src = m.foto;
  modalImg.onerror = () => modalImg.style.display = 'none';
  modalImg.style.display = '';
  modalName.textContent = m.nombre;
  modalRole.textContent = m.rol;
  modalChip.textContent = dep.label;
  modalBio.textContent = m.trayectoria;
  modalFecha.textContent = m.fecha;
  modalCorreo.textContent = m.correo;

  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function cerrarModal(){
  overlay.classList.remove('open');
  document.body.style.overflow = '';
}

closeBtn.addEventListener('click', cerrarModal);
overlay.addEventListener('click', (e)=>{ if(e.target === overlay) cerrarModal(); });
document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') cerrarModal(); });
</script>

</body>
</html>
